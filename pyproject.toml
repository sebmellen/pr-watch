[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-watch"
version = "0.1.0"
description = "Durable, provider-independent GitHub PR watches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/sebmellen/pr-watch"
Issues = "https://github.com/sebmellen/pr-watch/issues"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
pr-watch = "pr_watch.cli:main"

[tool.setuptools.packages.find]
include = ["pr_watch*"]
